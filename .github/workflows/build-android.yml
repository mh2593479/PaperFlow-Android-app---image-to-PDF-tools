name: Build PaperFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: unzip PaperFlow-Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/PaperFlow-Project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-debug-apk
          path: extracted/PaperFlow-Project/app/build/outputs/apk/debug/app-debug.apk
